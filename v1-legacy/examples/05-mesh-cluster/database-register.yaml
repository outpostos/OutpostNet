# 数据库服务注册配置
# 在 cluster-node-b 上运行，注册数据库后端服务

client:
  server_addr: "127.0.0.1:7000"
  auth_token: "mesh-cluster-secret-token-2024"
  mode: "register"
  conn_proto: "tcp"

# 工作负载配置 - 注册本地数据库服务实例
workloads:
  - metadata:
      id: "postgresql-primary"
      labels:
        app: "database"
        tier: "data"
        database: "postgresql"
        version: "v13.8"
        role: "primary"
        node: "cluster-node-b"
        zone: "east"
        datacenter: "dc1"
      # TTL 配置
      ttl: "10m"  # 数据库使用较长TTL
    spec:
      local_addr: "127.0.0.1"
      local_port: 5432
      protocol: "tcp"

  - metadata:
      id: "postgresql-admin"
      labels:
        app: "database"
        tier: "data"
        database: "postgresql"
        version: "v13.8"
        role: "admin"
        node: "cluster-node-b"
        zone: "east"
        datacenter: "dc1"
      # TTL 配置
      ttl: "10m"
    spec:
      local_addr: "127.0.0.1"
      local_port: 8080
      protocol: "tcp"

  - metadata:
      id: "auth-service-instance-1"
      labels:
        app: "auth-service"
        tier: "security"
        version: "v1.5"
        instance: "primary"
        node: "cluster-node-b"
        zone: "east"
        datacenter: "dc1"
      # TTL 配置
      ttl: "5m"
    spec:
      local_addr: "127.0.0.1"
      local_port: 8080
      protocol: "tcp"

  - metadata:
      id: "auth-service-grpc"
      labels:
        app: "auth-service"
        tier: "security"
        version: "v1.5"
        protocol: "grpc"
        node: "cluster-node-b"
        zone: "east"
        datacenter: "dc1"
      # TTL 配置
      ttl: "5m"
    spec:
      local_addr: "127.0.0.1"
      local_port: 9090
      protocol: "tcp"

# 健康检查配置
health_check:
  enabled: true
  interval: "30s"
  timeout: "15s"  # 数据库连接可能较慢
  retries: 3