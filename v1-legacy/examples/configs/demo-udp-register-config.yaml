# Keelnet Client Demo Configuration - UDP Register Mode
# UDP 服务提供方配置

client:
  server_addr: "127.0.0.1:17000"
  auth_token: "demo-udp-token"
  mode: "register"

# UDP 工作负载配置
workloads:
  - metadata:
      labels:
        app: "demo-udp"
        version: "v1"
        protocol: "udp"
        node: "demo-udp-register-node"
    spec:
      local_addr: "127.0.0.1"
      local_port: 18001
      protocol: "udp"

# 日志配置
logging:
  level: "info"
  format: "json"

# 健康检查配置
health_check:
  enabled: true
  interval: "10s"
  timeout: "5s"

# 区域配置 (Phase 2)
region:
  enabled: false
  region_id: "demo-region"
  node_id: "demo-udp-register-node"