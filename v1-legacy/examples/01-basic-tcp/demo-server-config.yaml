# OutpostNet Server Demo Configuration
# 动态服务发现模式 - 服务端不再预定义服务

server:
  listen_addr: "0.0.0.0:17000"
  auth_token: "demo-test-token"

# 监控配置
monitoring:
  enabled: true
  port: 9090

# 动态服务发现配置
service_discovery:
  mode: "dynamic"                    # 动态模式
  auto_create_services: true         # 自动创建服务
  default_load_balancer: "round_robin"
  service_ttl: "24h"                 # 服务生存时间
  cleanup_interval: "1h"             # 清理间隔

# 服务默认策略 (可选)
default_service_policy:
  load_balancer: "round_robin"
  health_check:
    enabled: true
    interval: "30s"
    timeout: "5s"
  session_affinity: false

# 日志配置
logging:
  level: "info"
  format: "json"

# 区域配置 (Phase 2)
region:
  enabled: false
  region_id: "demo-region"
  node_id: "demo-server-node"