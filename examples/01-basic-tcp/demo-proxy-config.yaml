# OutpostNet Client Demo Configuration - Proxy Mode
# 服务消费方配置，告知服务端需要什么样的端点

client:
  server_addr: "127.0.0.1:17000"
  auth_token: "demo-test-token"
  mode: "proxy"

# 代理配置
proxies:
  - name: "demo-web-proxy"
    local_port: 19999                    # 本地代理端口
    proxy_mode: "tcp"                    # 代理模式
    
    # 端点选择器 - 告诉服务端我要什么样的端点
    endpoint_selector:
      app: "demo-web"                    # 选择 app=demo-web 的端点
    
    # 负载均衡策略 (可选)
    load_balancer: "round_robin"
    
    # 端点过滤器 (可选)
    endpoint_filter:
      prefer_labels:                     # 优先选择的端点标签
        zone: "local"
        version: "v1"
      exclude_labels:                    # 排除的端点标签
        status: "maintenance"

# 日志配置
logging:
  level: "info"
  format: "json"

# 健康检查配置
health_check:
  enabled: true
  interval: "10s"
  timeout: "5s"

# 区域配置 (Phase 2)
region:
  enabled: false
  region_id: "demo-region"
  node_id: "demo-proxy-node"