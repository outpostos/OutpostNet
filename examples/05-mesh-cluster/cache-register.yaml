# 缓存和日志服务注册配置
# 在 cluster-node-c 上运行，注册缓存和日志服务

client:
  server_addr: "127.0.0.1:7000"
  auth_token: "mesh-cluster-secret-token-2024"
  mode: "register"
  conn_proto: "tcp"

# 工作负载配置 - 注册本地缓存和日志服务实例
workloads:
  - metadata:
      id: "redis-primary"
      labels:
        app: "redis"
        tier: "cache"
        version: "v6.2"
        role: "primary"
        node: "cluster-node-c"
        zone: "west"
        datacenter: "dc1"
      # TTL 配置
      ttl: "5m"
    spec:
      local_addr: "127.0.0.1"
      local_port: 6379
      protocol: "tcp"

  - metadata:
      id: "redis-sentinel"
      labels:
        app: "redis"
        tier: "cache"
        version: "v6.2"
        role: "sentinel"
        node: "cluster-node-c"
        zone: "west"
        datacenter: "dc1"
      # TTL 配置
      ttl: "5m"
    spec:
      local_addr: "127.0.0.1"
      local_port: 26379
      protocol: "tcp"

  - metadata:
      id: "elasticsearch-http"
      labels:
        app: "elasticsearch"
        tier: "logging"
        version: "v7.17"
        protocol: "http"
        node: "cluster-node-c"
        zone: "west"
        datacenter: "dc1"
      # TTL 配置
      ttl: "5m"
    spec:
      local_addr: "127.0.0.1"
      local_port: 9200
      protocol: "tcp"

  - metadata:
      id: "elasticsearch-transport"
      labels:
        app: "elasticsearch"
        tier: "logging"
        version: "v7.17"
        protocol: "transport"
        node: "cluster-node-c"
        zone: "west"
        datacenter: "dc1"
      # TTL 配置
      ttl: "5m"
    spec:
      local_addr: "127.0.0.1"
      local_port: 9300
      protocol: "tcp"

  - metadata:
      id: "prometheus-collector"
      labels:
        app: "prometheus"
        tier: "monitoring"
        version: "v2.40"
        node: "cluster-node-c"
        zone: "west"
        datacenter: "dc1"
      # TTL 配置
      ttl: "5m"
    spec:
      local_addr: "127.0.0.1"
      local_port: 9090
      protocol: "tcp"

# 健康检查配置
health_check:
  enabled: true
  interval: "30s"
  timeout: "10s"
  retries: 3