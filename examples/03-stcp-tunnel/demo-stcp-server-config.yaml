# OutpostNet Server Demo Configuration - STCP
# 动态服务发现模式 - 支持STCP加密隧道

server:
  listen_addr: "0.0.0.0:17002"
  auth_token: "demo-stcp-token"

# 监控配置
monitoring:
  enabled: true
  port: 9092

# 动态服务发现配置
service_discovery:
  mode: "dynamic"                    # 动态模式
  auto_create_services: true         # 自动创建服务
  default_load_balancer: "round_robin"  
  service_ttl: "24h"                 # 服务生存时间
  cleanup_interval: "1h"             # 清理间隔

# STCP安全配置
stcp_config:
  encryption:
    enabled: true                    # 启用加密
    algorithm: "AES-256-GCM"         # 加密算法
    key_rotation: "24h"              # 密钥轮换周期
  tls:
    enabled: true                    # 启用TLS
    auto_generate_certs: true        # 自动生成测试证书
    cert_file: ""                    # 服务端证书 (自动生成)
    key_file: ""                     # 服务端私钥 (自动生成)
    ca_file: ""                      # CA证书 (自动生成)

# 服务默认策略
default_service_policy:
  load_balancer: "round_robin"
  health_check:
    enabled: true
    interval: "30s"  
    timeout: "5s"
  security:
    require_encryption: true         # 要求加密

# 日志配置
logging:
  level: "debug"                     # STCP需要详细日志
  format: "json"

# 区域配置 (Phase 2)
region:
  enabled: false
  region_id: "demo-region"
  node_id: "demo-stcp-server"