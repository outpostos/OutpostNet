# node-b replacement: same node identity, new tunnel port, new instance (v2).
node_id: node-b
health_addr: 127.0.0.1:39384
management:
  socket_path: /tmp/outpostnet-service-example/node-b2.sock
auth:
  token: example-token
tls:
  insecure: true
tunnels:
  - role: server
    listen_addr: 127.0.0.1:39444
exports:
  - name: echo
    local_addr: 127.0.0.1:39092   # instance v2
    protocol: tcp
