apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: outpostnet-agent
  namespace: outpostnet-system
  labels:
    app.kubernetes.io/name: outpostnet-agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: outpostnet
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: outpostnet-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outpostnet-agent
        app.kubernetes.io/component: agent
    spec:
      hostNetwork: true
      tolerations:
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: agent
          image: outpostnet-agent:latest
          args:
            - --config=/etc/outpostnet/agent.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/outpostnet
            - name: persistence
              mountPath: /var/lib/outpostnet
            - name: socket
              mountPath: /run/outpostnet
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: health
              containerPort: 8082
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: outpostnet-agent-config
        - name: persistence
          hostPath:
            path: /var/lib/outpostnet
            type: DirectoryOrCreate
        - name: socket
          hostPath:
            path: /run/outpostnet
            type: DirectoryOrCreate
