apiVersion: v1
kind: ConfigMap
metadata:
  name: outpostnet-server-config
  namespace: outpostnet-system
  labels:
    app.kubernetes.io/name: outpostnet-server
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: outpostnet
data:
  server.yaml: |
    listen: "/var/run/outpostnet/server.sock"
    log_level: "info"
    heartbeat_timeout: "30s"
