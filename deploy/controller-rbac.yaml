apiVersion: v1
kind: ServiceAccount
metadata:
  name: outpostnet-controller
  namespace: outpostnet-system
  labels:
    app.kubernetes.io/name: outpostnet-controller
    app.kubernetes.io/part-of: outpostnet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: outpostnet-controller
  labels:
    app.kubernetes.io/name: outpostnet-controller
    app.kubernetes.io/part-of: outpostnet
rules:
  # Pods: read for reconciliation, webhook needs to read annotations
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  # ConfigMaps: create/update sidecar configs
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Services: create headless services for exported services
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # EndpointSlices: manage service endpoints
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Events: emit events for visibility
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

  # Leases: leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # MutatingWebhookConfigurations: manage webhook cert
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: outpostnet-controller
  labels:
    app.kubernetes.io/name: outpostnet-controller
    app.kubernetes.io/part-of: outpostnet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: outpostnet-controller
subjects:
  - kind: ServiceAccount
    name: outpostnet-controller
    namespace: outpostnet-system
