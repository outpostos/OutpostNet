# outpostnet-sidecar standalone 配置示例（进阶：单主机多应用场景）
#
# 注意：大多数场景只需要 outpostnet-agent，参见 standalone-agent-*.yaml。
# sidecar 需要配合 outpostnet-server 使用，用于同一台主机上多个应用共享隧道。
#
# 用途：将本地服务导出到网格，并将远程服务映射为本地端口。
# 本示例演示一个 Web API 服务导出，同时导入远程 PostgreSQL 和 Redis。
#
# 启动方式：
#   outpostnet-sidecar --config standalone-sidecar.yaml

server: /var/run/outpostnet/server.sock
sidecar_id: app-server-01
heartbeat_interval: 10s

# 导出本地服务给网格中其他节点访问
exports:
  - name: web-api
    local_port: 8080
    protocol: tcp

# 从网格中导入远程服务，映射为本地端口
imports:
  - name: postgres
    listen_port: 5432
    protocol: tcp
  - name: redis
    listen_port: 6379
    protocol: tcp
